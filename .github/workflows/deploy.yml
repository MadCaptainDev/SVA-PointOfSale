name: Deploy to Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  # Compiles the POS SCSS and React UI (public/js, mix-manifest.json) and commits the result
  # to main, so the server keeps deploying with a plain fast-forward pull.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build UI (production)
        run: |
          npm run compile-pos
          npx mix --production

      - name: Commit compiled assets if they changed
        run: |
          git add -A public/js public/mix-manifest.json \
            resources/pos/src/assets/css/frontend.css
          if git diff --cached --quiet; then
            echo "Compiled UI already up to date."
            exit 0
          fi
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: compile UI assets for ${GITHUB_SHA::8}"
          # Pushes made with GITHUB_TOKEN do not trigger another workflow run.
          git push origin HEAD:main

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Connection details live in repo secrets (this repo is public).
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Scope: this script only touches files tracked in git inside
            # APP_DIR, plus Laravel caches and forward migrations.
            # It never runs git reset/clean/checkout/stash, rm, migrate:fresh,
            # migrate:rollback or db:seed, and never touches .env, uploads,
            # storage/ or anything outside APP_DIR.
            APP_DIR=~/domains/pos.svasilksandreadymades.com/public_html
            cd "$APP_DIR"

            # Refuse to run anywhere but this app's checkout.
            case "$(git remote get-url origin)" in
              *MadCaptainDev/SVA-PointOfSale*) ;;
              *) echo "Refusing to deploy: $APP_DIR is not this repo's checkout"; exit 1 ;;
            esac
            # The server checkout is not on a branch named "main", so the branch
            # name is not checked; instead the code must be an older version of
            # main (checked after the fetch below).
            echo "Server checkout: $(git rev-parse --abbrev-ref HEAD) @ $(git rev-parse --short HEAD)"

            # Never overwrite edits made directly on the server.
            # public/uploads is app data (barcodes, reports) that the app itself
            # changes, so it is not counted here; merge --ff-only below still
            # refuses to overwrite any file changed on the server.
            if ! git diff --quiet -- . ':(exclude)public/uploads' \
              || ! git diff --cached --quiet -- . ':(exclude)public/uploads'; then
              echo "Refusing to deploy: tracked files were modified on the server:"
              git status --short --untracked-files=no -- . ':(exclude)public/uploads'
              exit 1
            fi

            git fetch origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Refusing to deploy: server code is not an older version of main"; exit 1
            fi
            echo "Files this deploy will change:"
            git diff --stat HEAD origin/main

            php artisan down --retry=5
            trap 'php artisan up' EXIT
            git merge --ff-only origin/main
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan migrate --force
            php artisan optimize
            php artisan view:cache
            git log -1 --format="Deployed %h %s at $(date)"
