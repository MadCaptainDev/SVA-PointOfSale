name: Deploy to Live Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Connection details live in repo secrets (this repo is public).
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/domains/pos.svasilksandreadymades.com/public_html
            php artisan down --retry=5
            trap 'php artisan up' EXIT
            git pull --ff-only origin main
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan migrate --force
            php artisan optimize
            php artisan view:cache
            # Hostinger disables PHP symlink(); uploads live in public/uploads anyway.
            php artisan storage:link --force || true
            git log -1 --format="Deployed %h %s at $(date)"
